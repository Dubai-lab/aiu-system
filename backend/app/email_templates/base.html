<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#0b2e59;padding:20px 28px;">
          <span style="display:inline-block;background:#f2c14e;color:#051833;font-weight:bold;border-radius:8px;padding:8px 10px;font-size:14px;">{{ university }}</span>
          <span style="color:#ffffff;font-size:16px;font-weight:bold;margin-left:10px;">{{ university }} Management System</span>
        </td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 28px;background:#f8fafc;color:#64748b;font-size:12px;">
          This is an automated message from {{ university }} Administration. Please do not reply.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
