<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin:16px 0;">
  {% for label, value in rows %}
  <tr>
    <td style="padding:10px 14px;color:#64748b;font-size:13px;width:45%;">{{ label }}</td>
    <td style="padding:10px 14px;font-weight:bold;font-family:Consolas,Menlo,monospace;font-size:14px;">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
<p style="text-align:center;margin:24px 0;">
  <a href="{{ login_url }}" style="background:#0b2e59;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:bold;display:inline-block;">Log in</a>
</p>
<p style="font-size:13px;color:#475569;">Or open this link: <a href="{{ login_url }}" style="color:#1f4f8f;">{{ login_url }}</a></p>
