<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin:16px 0;">
  {% for label, value in rows %}
  <tr>
    <td style="padding:10px 14px;color:#64748b;font-size:13px;width:45%;">{{ label }}</td>
    <td style="padding:10px 14px;font-weight:bold;font-size:14px;">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
